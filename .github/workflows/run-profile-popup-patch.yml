name: Run profile popup patch
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch
        run: |
          python - <<'PY'
          from pathlib import Path
          app = Path('src/App.tsx')
          s = app.read_text(encoding='utf-8')
          old = '''              {/* 프로필 표시 + 전환 */}\n              {onSwitchProfile ? (\n                <button\n                  type="button"\n                  className="menu-util-btn menu-profile-btn"\n                  aria-expanded={showProfileSwitch}\n                  onClick={() => setShowProfileSwitch((v) => !v)}\n                >\n                  <ArrowLeftRight size={15} />\n                  <span className="menu-profile-name">{activeProfileName}</span>\n                </button>\n              ) : (\n                <div className="menu-profile-static">\n                  <ArrowLeftRight size={15} />\n                  <span className="menu-profile-name">{activeProfileName}</span>\n                </div>\n              )}'''
          new = '''              {/* 프로필 표시 + 전환 */}\n              <div className="menu-profile-wrap">\n                {onSwitchProfile ? (\n                  <button\n                    type="button"\n                    className="menu-util-btn menu-profile-btn"\n                    aria-expanded={showProfileSwitch}\n                    onClick={() => setShowProfileSwitch((v) => !v)}\n                  >\n                    <ArrowLeftRight size={15} />\n                    <span className="menu-profile-name">{activeProfileName}</span>\n                  </button>\n                ) : (\n                  <div className="menu-profile-static">\n                    <ArrowLeftRight size={15} />\n                    <span className="menu-profile-name">{activeProfileName}</span>\n                  </div>\n                )}\n                {onSwitchProfile && showProfileSwitch && (\n                  <div className="profile-switch-popup" role="menu" aria-label="프로필 전환">\n                    {profiles.filter((profile) => profile.id !== activeProfileId).map((profile) => (\n                      <button\n                        key={profile.id}\n                        type="button"\n                        role="menuitem"\n                        className="profile-switch-option"\n                        onClick={() => {\n                          onSwitchProfile(profile.id);\n                          setShowProfileSwitch(false);\n                          setOpen(false);\n                        }}\n                      >\n                        <ArrowLeftRight size={15} />\n                        <span>{profile.name}</span>\n                      </button>\n                    ))}\n                  </div>\n                )}\n              </div>'''
          if old not in s: raise SystemExit('App target not found')
          s = s.replace(old, new, 1)
          old2 = '''          {open && onSwitchProfile && showProfileSwitch && (\n            <div className="profile-switch-popup" role="menu" aria-label="프로필 전환">\n              {profiles.filter((profile) => profile.id !== activeProfileId).map((profile) => (\n                <button\n                  key={profile.id}\n                  type="button"\n                  role="menuitem"\n                  className="profile-switch-option"\n                  onClick={() => {\n                    onSwitchProfile(profile.id);\n                    setShowProfileSwitch(false);\n                    setOpen(false);\n                  }}\n                >\n                  <ArrowLeftRight size={15} />\n                  <span>{profile.name}</span>\n                </button>\n              ))}\n            </div>\n          )}\n'''
          if old2 not in s: raise SystemExit('old popup not found')
          app.write_text(s.replace(old2, '', 1), encoding='utf-8')

          css = Path('src/styles.css')
          c = css.read_text(encoding='utf-8')
          old_css = '''/* Profile switch popup */\n.profile-switch-popup {\n  position: absolute;\n  top: 0;\n  right: 0;\n  transform: translateY(calc(-100% - 8px));\n  z-index: 201;\n  width: 228px;\n  max-height: 280px;\n  overflow-y: auto;\n  padding: 8px;\n  border: 1px solid rgba(145, 181, 220, 0.28);\n  border-radius: 8px;\n  background: #0a1c34;\n  box-shadow: 0 18px 50px rgba(0, 0, 0, 0.42);\n}\n\n.profile-switch-option {\n  width: 100%;\n  min-height: 44px;\n  display: flex;\n  align-items: center;\n  gap: 9px;\n  padding: 0 12px;\n  border: 0;\n  border-radius: 12px;\n  color: #dceaff;\n  background: transparent;\n  text-align: left;\n  cursor: pointer;\n}\n\n.profile-switch-option:hover,\n.profile-switch-option:focus-visible {\n  background: #143a66;\n  outline: none;\n}\n\n.profile-switch-option span {\n  min-width: 0;\n  overflow: hidden;\n  text-overflow: ellipsis;\n  white-space: nowrap;\n}\n'''
          new_css = '''/* Profile switch popup */\n.menu-profile-wrap {\n  position: relative;\n}\n\n.profile-switch-popup {\n  position: absolute;\n  top: calc(100% + 6px);\n  right: 0;\n  z-index: 201;\n  width: 180px;\n  max-width: calc(100vw - 32px);\n  max-height: 280px;\n  overflow-y: auto;\n  padding: 6px;\n  border: 1px solid rgba(125, 211, 252, 0.34);\n  border-radius: 10px;\n  background: #153a5c;\n  box-shadow: 0 16px 38px rgba(0, 0, 0, 0.48);\n}\n\n.profile-switch-option {\n  width: 100%;\n  min-height: 40px;\n  display: flex;\n  align-items: center;\n  gap: 9px;\n  padding: 0 10px;\n  border: 0;\n  border-radius: 8px;\n  color: #e8f4ff;\n  background: transparent;\n  text-align: left;\n  cursor: pointer;\n}\n\n.profile-switch-option:hover,\n.profile-switch-option:focus-visible {\n  background: #1c4a73;\n  outline: none;\n}\n\n.profile-switch-option span {\n  min-width: 0;\n  overflow: hidden;\n  text-overflow: ellipsis;\n  white-space: nowrap;\n}\n'''
          if old_css not in c: raise SystemExit('CSS target not found')
          css.write_text(c.replace(old_css, new_css, 1), encoding='utf-8')
          PY
      - run: npm ci
      - run: npm run build
      - name: Commit and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/styles.css
          git commit -m "fix: anchor profile switch popup below profile"
          git push
          git fetch origin main
          git reset --hard origin/main
          git rm .github/workflows/run-profile-popup-patch.yml .github/workflows/patch-profile-popup.yml
          git commit -m "chore: remove temporary profile popup workflows"
          git push
