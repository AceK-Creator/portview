name: Patch profile switch UX

on:
  push:
    paths:
      - .github/workflows/patch-profile-switch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch profile switch UX
        shell: python
        run: |
          from pathlib import Path

          app = Path('src/App.tsx')
          text = app.read_text(encoding='utf-8')

          replacements = [
              (
                  "  onSwitchProfile?: () => void;\n",
                  "  onSwitchProfile?: (id: string) => void;\n"
              ),
              (
                  "  activeProfileName: string;\n  profiles: Profile[];\n",
                  "  activeProfileName: string;\n  activeProfileId: string;\n  profiles: Profile[];\n"
              ),
              (
                  "  const [open, setOpen] = useState(false);\n  const [showProfileMgmt, setShowProfileMgmt] = useState(false);\n",
                  "  const [open, setOpen] = useState(false);\n  const [showProfileSwitch, setShowProfileSwitch] = useState(false);\n  const [showProfileMgmt, setShowProfileMgmt] = useState(false);\n"
              ),
              (
                  "    if (!open) return;\n    const handler = (e: MouseEvent) => {\n      if (menuRef.current && !menuRef.current.contains(e.target as Node)) {\n        setOpen(false);\n      }\n    };\n",
                  "    if (!open) {\n      setShowProfileSwitch(false);\n      return;\n    }\n    const handler = (e: MouseEvent) => {\n      if (menuRef.current && !menuRef.current.contains(e.target as Node)) {\n        setOpen(false);\n        setShowProfileSwitch(false);\n      }\n    };\n"
              ),
              (
                  "              {onSwitchProfile ? (\n                <button type=\"button\" className=\"menu-util-btn menu-profile-btn\" onClick={() => { setOpen(false); onSwitchProfile(); }}>\n                  <ArrowLeftRight size={15} />\n                  <span className=\"menu-profile-name\">{activeProfileName}</span>\n                </button>\n",
                  "              {onSwitchProfile ? (\n                <button\n                  type=\"button\"\n                  className=\"menu-util-btn menu-profile-btn\"\n                  aria-expanded={showProfileSwitch}\n                  onClick={() => setShowProfileSwitch((v) => !v)}\n                >\n                  <ArrowLeftRight size={15} />\n                  <span className=\"menu-profile-name\">{activeProfileName}</span>\n                </button>\n"
              ),
              (
                  "            </nav>\n          )}\n          {showProfileMgmt && (\n",
                  "            </nav>\n          )}\n          {open && onSwitchProfile && showProfileSwitch && (\n            <div className=\"profile-switch-popup\" role=\"menu\" aria-label=\"프로필 전환\">\n              {profiles.filter((profile) => profile.id !== activeProfileId).map((profile) => (\n                <button\n                  key={profile.id}\n                  type=\"button\"\n                  role=\"menuitem\"\n                  className=\"profile-switch-option\"\n                  onClick={() => {\n                    onSwitchProfile(profile.id);\n                    setShowProfileSwitch(false);\n                    setOpen(false);\n                  }}\n                >\n                  <ArrowLeftRight size={15} />\n                  <span>{profile.name}</span>\n                </button>\n              ))}\n            </div>\n          )}\n          {showProfileMgmt && (\n"
              ),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Expected App.tsx snippet not found:\n{old}')
              text = text.replace(old, new, 1)

          old_call = "        onSwitchProfile={profiles.length > 1 ? () => setActiveProfileId(null) : undefined}\n"
          new_call = "        onSwitchProfile={profiles.length > 1 ? (id) => setActiveProfileId(id) : undefined}\n        activeProfileId={activeProfile.id}\n"
          if old_call not in text:
              raise SystemExit('Expected AppHeader call snippet not found')
          text = text.replace(old_call, new_call, 1)

          app.write_text(text, encoding='utf-8')

          css = Path('src/styles.css')
          css_text = css.read_text(encoding='utf-8')
          marker = '/* Profile switch popup */'
          if marker not in css_text:
              css_text += '''\n\n/* Profile switch popup */\n.profile-switch-popup {\n  position: absolute;\n  top: 0;\n  right: 0;\n  transform: translateY(calc(-100% - 8px));\n  z-index: 201;\n  width: 228px;\n  max-height: 280px;\n  overflow-y: auto;\n  padding: 8px;\n  border: 1px solid rgba(145, 181, 220, 0.28);\n  border-radius: 8px;\n  background: #0a1c34;\n  box-shadow: 0 18px 50px rgba(0, 0, 0, 0.42);\n}\n\n.profile-switch-option {\n  width: 100%;\n  min-height: 44px;\n  display: flex;\n  align-items: center;\n  gap: 9px;\n  padding: 0 12px;\n  border: 0;\n  border-radius: 12px;\n  color: #dceaff;\n  background: transparent;\n  text-align: left;\n  cursor: pointer;\n}\n\n.profile-switch-option:hover,\n.profile-switch-option:focus-visible {\n  background: #143a66;\n  outline: none;\n}\n\n.profile-switch-option span {\n  min-width: 0;\n  overflow: hidden;\n  text-overflow: ellipsis;\n  white-space: nowrap;\n}\n'''
              css.write_text(css_text, encoding='utf-8')
      
      - name: Verify build
        run: |
          npm ci
          npm run build

      - name: Commit patched files and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/styles.css
          git rm .github/workflows/patch-profile-switch.yml
          git commit -m "fix: switch profiles without leaving current screen"
          git push
