name: Optimize dividend estimate timing

on:
  push:
    branches: [main]

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch dividend estimate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('src/App.tsx')
          s = p.read_text()

          old = '''// 세션 동안 예상 배당금 캐시 (컴포넌트 언마운트 후에도 유지, 페이지 새로고침 시 초기화)\nlet _estCache: number | null = null;\nlet _estCacheKey = '';\nlet _estSourceCache = 'none';\n\n'''
          new = '''async function calculateDividendEstimate(\n  holdings: Holding[],\n  dividends: DividendRecord[],\n  isOverseas: boolean,\n): Promise<{ total: number; source: string }> {\n  const market: AccountMode = isOverseas ? 'overseas' : 'domestic';\n  const today = new Date();\n  const estimates = await Promise.all(\n    holdings.map(async (holding) => {\n      try {\n        const info = await fetchDividendInfo(holding.code, market);\n        return calculateNextMonthEstimate({\n          code: holding.code,\n          shares: holding.shares,\n          dividends,\n          externalDps: info.dps,\n          externalSource: info.source,\n          asOf: today,\n        });\n      } catch {\n        return calculateNextMonthEstimate({\n          code: holding.code,\n          shares: holding.shares,\n          dividends,\n          externalDps: null,\n          externalSource: 'error',\n          asOf: today,\n        });\n      }\n    }),\n  );\n\n  const total = estimates.reduce((sum, estimate) => sum + (estimate.amount ?? 0), 0);\n  const sources = [...new Set(\n    estimates\n      .filter((estimate) => estimate.amount != null)\n      .map((estimate) => estimate.source),\n  )];\n  return {\n    total,\n    source: sources.length === 0 ? 'none' : sources.length === 1 ? sources[0] : 'mixed',\n  };\n}\n\n'''
          if old not in s:
              raise SystemExit('old cache block not found')
          s = s.replace(old, new, 1)

          old = '''function DividendSummaryTab({\n  dividends,\n  holdings,\n  onOpenAdd,\n}: {\n  dividends: DividendRecord[];\n  holdings: Holding[];\n  onOpenAdd: () => void;\n}) {'''
          new = '''function DividendSummaryTab({\n  dividends,\n  holdings,\n  onOpenAdd,\n  estimatedNextMonthTotal,\n  estimatedSource,\n  estimatedLoading,\n}: {\n  dividends: DividendRecord[];\n  holdings: Holding[];\n  onOpenAdd: () => void;\n  estimatedNextMonthTotal: number | null;\n  estimatedSource: string;\n  estimatedLoading: boolean;\n}) {'''
          if old not in s:
              raise SystemExit('DividendSummaryTab signature not found')
          s = s.replace(old, new, 1)

          start = s.index('  // 다음달 예상 배당금 (세션 캐시 활용)', s.index('function DividendSummaryTab'))
          end = s.index('  // 누적 배당금', start)
          s = s[:start] + s[end:]

          # DividendSummaryTab is rendered once inside DividendView. Inject props into that call.
          summary_start = s.index('function DividendView(')
          call_start = s.index('<DividendSummaryTab', summary_start)
          call_end = s.index('/>', call_start) + 2
          call = s[call_start:call_end]
          if 'estimatedNextMonthTotal=' not in call:
              insertion = '''\n          estimatedNextMonthTotal={estimatedNextMonthTotal}\n          estimatedSource={estimatedSource}\n          estimatedLoading={estimatedLoading}'''
              call = call[:-2] + insertion + '\n        />'
              s = s[:call_start] + call + s[call_end:]

          old = '''function DividendView({\n  data,\n  onDataChange,\n}: {\n  data: AppData;\n  onDataChange: (data: AppData) => void;\n}) {'''
          new = '''function DividendView({\n  data,\n  onDataChange,\n  estimatedNextMonthTotal,\n  estimatedSource,\n  estimatedLoading,\n}: {\n  data: AppData;\n  onDataChange: (data: AppData) => void;\n  estimatedNextMonthTotal: number | null;\n  estimatedSource: string;\n  estimatedLoading: boolean;\n}) {'''
          if old not in s:
              raise SystemExit('DividendView signature not found')
          s = s.replace(old, new, 1)

          old = '''  const [marketRefreshKey, setMarketRefreshKey] = useState(0);\n  const [unlocked, setUnlocked] = useState(false);'''
          new = '''  const [marketRefreshKey, setMarketRefreshKey] = useState(0);\n  const [unlocked, setUnlocked] = useState(false);\n  const [estimatedNextMonthTotal, setEstimatedNextMonthTotal] = useState<number | null>(null);\n  const [estimatedSource, setEstimatedSource] = useState('none');\n  const [estimatedLoading, setEstimatedLoading] = useState(false);'''
          if old not in s:
              raise SystemExit('App state anchor not found')
          s = s.replace(old, new, 1)

          anchor = '''  const summary = useMemo(() => calculateAccountSummary(rows, data.account), [rows, data.account]);\n\n'''
          insert = '''  const summary = useMemo(() => calculateAccountSummary(rows, data.account), [rows, data.account]);\n\n  // PIN 인증 후 선택된 프로필의 예상 배당금을 백그라운드에서 미리 계산한다.\n  // 탭 전환으로 DividendView가 마운트/언마운트되어도 계산 결과는 App에서 유지된다.\n  const dividendEstimateKey = useMemo(() => JSON.stringify({\n    profileId: activeProfile.id,\n    accountMode,\n    holdings: data.holdings.map((h) => [h.code, h.shares]),\n    dividends: (data.dividends ?? []).map((d) => [d.stockCode, d.paidAt, d.amount]),\n  }), [activeProfile.id, accountMode, data.holdings, data.dividends]);\n\n  useEffect(() => {\n    if (!unlocked || !activeProfileId) return;\n    if (data.holdings.length === 0) {\n      setEstimatedNextMonthTotal(0);\n      setEstimatedSource('none');\n      setEstimatedLoading(false);\n      return;\n    }\n\n    let cancelled = false;\n    setEstimatedLoading(true);\n    calculateDividendEstimate(data.holdings, data.dividends ?? [], isOverseas)\n      .then((result) => {\n        if (cancelled) return;\n        setEstimatedNextMonthTotal(result.total);\n        setEstimatedSource(result.source);\n        setEstimatedLoading(false);\n      })\n      .catch(() => {\n        if (!cancelled) setEstimatedLoading(false);\n      });\n\n    return () => { cancelled = true; };\n  // dividendEstimateKey intentionally captures the complete calculation inputs.\n  // eslint-disable-next-line react-hooks/exhaustive-deps\n  }, [unlocked, activeProfileId, dividendEstimateKey]);\n\n'''
          if anchor not in s:
              raise SystemExit('App summary anchor not found')
          s = s.replace(anchor, insert, 1)

          old = '''      {activeMenu === 'dividend' && <DividendView data={data} onDataChange={persist} />}'''
          new = '''      {activeMenu === 'dividend' && (\n        <DividendView\n          data={data}\n          onDataChange={persist}\n          estimatedNextMonthTotal={estimatedNextMonthTotal}\n          estimatedSource={estimatedSource}\n          estimatedLoading={estimatedLoading}\n        />\n      )}'''
          if old not in s:
              raise SystemExit('DividendView render not found')
          s = s.replace(old, new, 1)

          p.write_text(s)
          PY
      - name: Build
        run: |
          npm ci
          npm run build
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx
          git diff --cached --quiet || git commit -m "perf: preload dividend estimate after unlock"
          git push
      - name: Remove temporary workflow
        if: success()
        run: |
          git rm .github/workflows/optimize-dividend-estimate.yml
          git commit -m "chore: remove temporary dividend optimization workflow"
          git push
