name: Optimize dividend estimate timing

on:
  push:
    branches: [main]

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch missing label
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/App.tsx')
          s = p.read_text()
          old = "  const estimatedLoading = useState(false);"
          if old in s:
              pass
          # The previous patch moved estimatedSourceLabel out with the old effect.
          # Recreate the same display label locally in DividendSummaryTab.
          marker = "  const totalReceived = dividends.reduce((sum, d) => sum + d.amount, 0);"
          if marker not in s:
              raise SystemExit('DividendSummaryTab insertion anchor not found')
          insertion = marker + "\n\n  const estimatedSourceLabel = estimatedSource === 'none' ? '예상 불가' : estimatedSource === 'mixed' ? '혼합' : estimatedSource;"
          if "const estimatedSourceLabel = estimatedSource === 'none'" not in s:
              s = s.replace(marker, insertion, 1)
          p.write_text(s)
          PY
      - name: Build
        run: |
          npm ci
          npm run build
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx
          git diff --cached --quiet || git commit -m "perf: preload dividend estimate after unlock"
          git push
      - name: Remove temporary workflow
        if: success()
        run: |
          git rm .github/workflows/optimize-dividend-estimate.yml
          git commit -m "chore: remove temporary dividend optimization workflow"
          git push
